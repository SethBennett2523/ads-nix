# Evaluates every machine, image and dev shell on each push and pull request.
# Evaluation catches nearly every mistake a config change can make and takes
# a few minutes, so it fits the free tier even while this repo is private
# (public repositories are unmetered). Nothing is built here: building ROS
# and desktops would take hours on a hosted runner.
name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
      - name: Evaluate everything
        run: ./scripts/check.sh
